name: Deploy website to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_FORMS_ENDPOINT: ${{ vars.FORMS_ENDPOINT }}
      - name: Add route entry points and single-page app fallback
        run: |
          for route in schedule private-classes workshops retreats about contact; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          cp dist/index.html dist/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
